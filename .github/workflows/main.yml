name: Universal Multi-threaded Build OmniRoute Binary (Linux)

on:
  push:
    branches:
      - 'release/v3.8.50'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Universal Linux Binary
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Tambah Swap Space 8GB (Mencegah Process Killed / OOM)
      - name: Increase Swap Space
        run: |
          sudo swapoff /swapfile_extra 2>/dev/null || true
          sudo rm -f /swapfile_extra
          sudo fallocate -l 8G /swapfile_extra || sudo dd if=/dev/zero of=/swapfile_extra bs=1M count=8192
          sudo chmod 600 /swapfile_extra
          sudo mkswap /swapfile_extra
          sudo swapon /swapfile_extra
          echo "=== Memori & Swap Berhasil Ditambahkan ==="
          free -h

      # 2. Setup Node.js 24 + Otomatis Cache NPM via setup-node
      - name: Setup Node.js (v24)
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      # 3. Install Parallel Tools (pigz)
      - name: Install Parallel Tools (pigz)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pigz

      # 4. OPTIMIZED CACHE STRATEGY (Next.js, SWC/Compiler, & PKG Cache)
      - name: Cache Next.js Build & PKG Runtimes
        uses: actions/cache@v4
        with:
          path: |
            .build/next/cache
            node_modules/.cache
            ~/.pkg-cache
          # github.sha memastikan cache SELALU ter-update & disimpan di setiap run
          key: ${{ runner.os }}-omniroute-build-${{ hashFiles('**/package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-omniroute-build-${{ hashFiles('**/package-lock.json') }}-
            ${{ runner.os }}-omniroute-build-

      # 5. Fast Install Dependencies
      - name: Install Dependencies
        run: npm ci --prefer-offline --no-audit

      # 6. Build OmniRoute Release
      - name: Build OmniRoute Release
        run: |
          CPU_CORES=$(nproc)
          
          echo "Node version: $(node -v)"
          echo "Alokasi Heap Node.js: 6144 MB (6GB) + 8GB Swap"
          echo "CPU Cores terdeteksi: ${CPU_CORES}"
          
          export NODE_OPTIONS="--max-old-space-size=6144"
          export UV_THREADPOOL_SIZE=${CPU_CORES}
          export NEXT_TELEMETRY_DISABLED=1
          
          npm run build:release

      # 7. Install PKG
      - name: Install PKG
        run: npm install -g @yao-pkg/pkg --prefer-offline

      # 8. Compile Standalone Server (Jalur: .build/next/standalone)
      - name: Compile Standalone Server to Binary
        run: |
          if [ ! -f ".build/next/standalone/server.js" ]; then
            echo "::error:: File .build/next/standalone/server.js tidak ditemukan!"
            ls -la .build/next/ || true
            exit 1
          fi

          if [ -d "public" ]; then
            cp -r public .build/next/standalone/
          fi

          if [ -d ".build/next/static" ]; then
            mkdir -p .build/next/standalone/.build/next
            cp -r .build/next/static .build/next/standalone/.build/next/
            mkdir -p .build/next/standalone/.next
            cp -r .build/next/static .build/next/standalone/.next/
          fi

          cd .build/next/standalone
          pkg server.js --targets node20-linux-x64 --output ../../../dist/omniroute-linux

      # 9. Multi-threaded Tar Compression (pigz)
      - name: Package Binary & Assets
        run: |
          mkdir -p dist/public dist/.build/next dist/.next
          if [ -d "public" ]; then cp -r public dist/; fi
          if [ -d ".build/next/static" ]; then
            cp -r .build/next/static dist/.build/next/
            cp -r .build/next/static dist/.next/
          fi

          cd dist
          tar -I pigz -cf ../omniroute-linux-v3.8.50.tar.gz omniroute-linux public .build .next 2>/dev/null || tar -I pigz -cf ../omniroute-linux-v3.8.50.tar.gz omniroute-linux .build

      # 10. Upload Artifact
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: omniroute-linux-v3.8.50
          path: omniroute-linux-v3.8.50.tar.gz
          compression-level: 0
          retention-days: 14
