name: Release OmniRoute Binary (Linux)

on:
  push:
    tags:
      - 'v*.*.*'
      - 'Release/*'
      - 'release/*'
  workflow_dispatch:

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    permissions:
      contents: write # Diberikan akses untuk mengunggah asset ke GitHub Release

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Next.js App
        run: npm run build

      - name: Copy Static Assets to Standalone
        run: |
          cp -r public .next/standalone/public
          cp -r .next/static .next/standalone/.next/static

      - name: Install PKG
        run: npm install -g @yao-pkg/pkg

      - name: Compile to Linux Binary
        run: |
          cd .next/standalone
          pkg server.js --targets node20-linux-x64 --output ../../dist/omniroute-linux

      - name: Package Binary with Assets (.tar.gz)
        run: |
          mkdir -p dist/public dist/.next
          cp -r public dist/
          cp -r .next/static dist/.next/

          cd dist
          tar -czvf ../omniroute-linux-x64.tar.gz omniroute-linux public .next

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: omniroute-linux-x64.tar.gz
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
