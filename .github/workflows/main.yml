name: Build OmniRoute Binary (Linux)

on:
  push:
    branches:
      - 'release/v3.8.50'
  workflow_dispatch:

jobs:
  build:
    name: Build Linux Binary
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Native Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 libsecret-1-dev

      - name: Setup Node.js (v22)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build OmniRoute Release
        run: npm run build:release

      - name: Install PKG
        run: npm install -g @yao-pkg/pkg

      - name: Compile Standalone Server to Binary
        run: |
          # Menyalin asset statis ke folder standalone Next.js
          cp -r public .next/standalone/public
          cp -r .next/static .next/standalone/.next/static
          
          # Compile standalone server.js
          cd .next/standalone
          pkg server.js --targets node22-linux-x64 --output ../../dist/omniroute-linux

      - name: Package Binary & Assets (.tar.gz)
        run: |
          mkdir -p dist/public dist/.next
          cp -r public dist/
          cp -r .next/static dist/.next/

          cd dist
          tar -czvf ../omniroute-linux-v3.8.50.tar.gz omniroute-linux public .next

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: omniroute-linux-v3.8.50
          path: omniroute-linux-v3.8.50.tar.gz
          retention-days: 14
