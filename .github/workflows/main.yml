name: Fast Multi-threaded Build OmniRoute Binary (Linux - Node 24)

on:
  push:
    branches:
      - 'release/v3.8.50'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Linux Binary (Node 24)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Setup Node.js 24
      - name: Setup Node.js (v24)
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      # 2. Install pigz (Multi-threaded Gzip)
      - name: Install Parallel Tools (pigz)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pigz

      # 3. Cache Next.js & NPM
      - name: Restore Next.js Build Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            .next/cache
          key: ${{ runner.os }}-omniroute-node24-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx', '**/*.mjs') }}
          restore-keys: |
            ${{ runner.os }}-omniroute-node24-${{ hashFiles('**/package-lock.json') }}-
            ${{ runner.os }}-omniroute-node24-

      # 4. Fast Install
      - name: Install Dependencies
        run: npm ci --prefer-offline --no-audit

      # 5. Multi-threaded & Dynamic RAM Build
      - name: Build OmniRoute Release
        run: |
          # Hitung RAM aman (Total Memori dikurangi 1024 MB untuk OS)
          TOTAL_RAM_MB=$(free -m | awk '/Mem:/ {print $2}')
          SAFE_MAX_OLD_SPACE=$((TOTAL_RAM_MB - 1024))
          
          # Hitung jumlah CPU core
          CPU_CORES=$(nproc)
          
          echo "Node version: $(node -v)"
          echo "RAM terdeteksi: ${TOTAL_RAM_MB}MB | Heap Node.js: ${SAFE_MAX_OLD_SPACE}MB"
          echo "CPU Cores terdeteksi: ${CPU_CORES}"
          
          export NODE_OPTIONS="--max-old-space-size=${SAFE_MAX_OLD_SPACE}"
          export UV_THREADPOOL_SIZE=${CPU_CORES}
          export NEXT_TELEMETRY_DISABLED=1
          
          npm run build:release

      # 6. Install PKG
      - name: Install PKG
        run: npm install -g @yao-pkg/pkg --prefer-offline

      # 7. Compile Standalone Server (Target Node 24)
      - name: Compile Standalone Server to Binary
        run: |
          cp -r public .next/standalone/public
          cp -r .next/static .next/standalone/.next/static
          
          cd .next/standalone
          pkg server.js --targets node24-linux-x64 --output ../../dist/omniroute-linux

      # 8. Multi-threaded Tar Compression
      - name: Package Binary & Assets (Parallel Tar)
        run: |
          mkdir -p dist/public dist/.next
          cp -r public dist/
          cp -r .next/static dist/.next/

          cd dist
          tar -I pigz -cf ../omniroute-linux-v3.8.50.tar.gz omniroute-linux public .next

      # 9. Upload Artifact
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: omniroute-linux-v3.8.50
          path: omniroute-linux-v3.8.50.tar.gz
          compression-level: 0
          retention-days: 14
